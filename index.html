<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="夢幻水族箱">
<meta name="theme-color" content="#06101c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>夢幻水族箱</title>
<style>
:root{
  color-scheme:dark;
  --bg:#06101c; --panel:#13243a; --panel2:#1a3150; --text:#eef4ff; --muted:#a3b8d4;
  --accent:#ffc940; --good:#4cd98b; --bad:#ff6b6b; --border:#2c4a70; --btn:#2a5a8f; --btnh:#3570b0;
  --glass:rgba(8,20,36,.62);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-size:17px;line-height:1.45;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;font:inherit;font-size:16px;color:var(--text);background:var(--btn);border:1px solid transparent;border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer}
button:hover:not(:disabled){background:var(--btnh)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:var(--accent);color:#2a1d00;font-weight:700}
button.ghost{background:transparent;border-color:var(--border)}
button.star{background:#5a3d9a}
button.star:hover:not(:disabled){background:#7050b8}
/* 整個畫面就是水族箱 */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
canvas{display:block;touch-action:none;cursor:pointer}
/* 浮在水族箱上的資訊與按鈕 */
#hud,#ctrls{position:absolute;top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;z-index:5}
#hud{left:max(8px,env(safe-area-inset-left));pointer-events:none}
#ctrls{right:max(8px,env(safe-area-inset-right));justify-content:flex-end}
.pill{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-size:17px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.coin{color:var(--accent)}
.pill.star{color:#fff27a}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.pill.bump{animation:bump .3s ease-out}
#ctrls button{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-color:rgba(255,255,255,.16);white-space:nowrap}
#ctrls button.on{background:var(--accent);color:#2a1d00;border-color:var(--accent)}
#menuBtn{font-weight:700;padding-inline:16px}
/* 選單面板：從右側滑出 */
#menuBack{position:fixed;inset:0;background:rgba(3,8,16,.45);z-index:10}
#menuBack[hidden],#menu[hidden]{display:none}
#menu{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:var(--panel);border-left:1px solid var(--border);z-index:11;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-right:env(safe-area-inset-right);box-shadow:-12px 0 40px rgba(0,0,0,.45);animation:slideIn .22s ease-out}
@keyframes slideIn{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
.menuHead{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 16px;border-bottom:1px solid var(--border)}
.menuHead b{font-size:19px;flex:1}
nav{display:flex;border-bottom:1px solid var(--border)}
nav button{flex:1;border-radius:0;background:transparent;padding:10px 2px;font-size:16px;white-space:nowrap;letter-spacing:-.3px}
nav button.on{background:var(--panel2);color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
#tab{overflow-y:auto;padding:12px 14px;flex:1;-webkit-overflow-scrolling:touch}
/* 橫向手機高度很矮：標題列、分頁縮小，讓內容有更多空間 */
@media (max-height:500px){
  .menuHead{padding:4px 8px 4px 12px}
  .menuHead b{font-size:16px}
  .menuHead button{min-height:36px;padding:4px 10px;font-size:15px}
  nav button{min-height:38px;padding:4px 1px}
  #tab{padding:8px 10px}
}
.hint{color:var(--muted);font-size:15px;margin:6px 2px}
h3{margin:4px 0 10px;font-size:19px}
h4{margin:16px 0 8px;font-size:16px;color:var(--muted)}
.card{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card small{color:var(--muted);font-size:14px}
.card small.own{color:var(--text)}
.card small.own b{color:var(--accent)}
.card img{width:92px;height:55px;flex:none}
.ico{font-size:32px;width:46px;text-align:center;flex:none}
.swatch{width:72px;height:48px;border-radius:6px;flex:none;border:1px solid var(--border)}
.bar{height:8px;background:#0a1320;border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--good)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fishrow>span{flex-basis:100%!important}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.slot{aspect-ratio:1;font-size:26px;padding:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel2);border:2px solid var(--border);line-height:1.1}
.slot small{font-size:12px;color:var(--muted)}
.slot.sel{border-color:var(--accent)}
select{font:inherit;font-size:15px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px;min-height:38px}
.bonus{font-size:14px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:10px;line-height:1.75}
.bonus b{color:var(--good)}
.tier{font-weight:700}
#fishCard{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));background:rgba(10,20,35,.94);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:230px;max-width:calc(100% - 20px);font-size:15px;display:none;z-index:6}
#fishCard b{font-size:17px}
.modal{position:fixed;inset:0;background:rgba(3,8,16,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.modal .box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px 22px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.modal p{margin:0 0 16px;line-height:1.65;white-space:pre-line;font-size:18px}
.modal .row{justify-content:flex-end}
.bigLink{display:block;background:var(--accent);color:#2a1d00;font-weight:800;font-size:18px;text-align:center;text-decoration:none;padding:12px 14px;border-radius:12px;margin:0 0 14px}
.bigLink small{display:block;font-weight:500;font-size:14px;margin-top:2px}
.modal textarea{width:100%;min-height:96px;font:inherit;font-size:14px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:12px;word-break:break-all;resize:vertical}
.modal .big{font-size:30px;font-weight:800;color:var(--accent);text-align:center;margin:4px 0 14px}
#toast{position:fixed;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 56px));transform:translateX(-50%);background:rgba(10,20,35,.95);border:1px solid var(--accent);color:var(--text);padding:10px 18px;font-size:17px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.pill.bump{animation:none}#menu{animation:none}}
/* 小螢幕（手機）：按鈕只留圖示與價格，字稍微縮小 */
@media (max-width:700px),(max-height:500px){
  .pill{padding:4px 10px;font-size:16px}
  #ctrls button{padding:4px 10px;min-height:40px;font-size:16px}
  .lbl{display:none}
  #menu{width:min(420px,100vw)}
  .card{padding:8px;gap:8px}
  .card img{width:66px;height:40px}
  .ico{font-size:26px;width:38px}
  .card button,.card select{font-size:15px;padding:6px 9px;min-height:40px}
  nav button{font-size:15px;padding:8px 1px}
  #fishCard{min-width:190px;font-size:14px;padding:8px 10px}
  #fishCard button{padding:5px 9px;min-height:38px}
  .modal p{font-size:17px;margin-bottom:10px}
  .modal .big{font-size:26px;margin-bottom:8px}
}
#rotateHint{display:none;position:absolute;left:16px;right:16px;bottom:max(24px,env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:16px}
@media (max-width:520px){ #hud{top:calc(max(8px,env(safe-area-inset-top)) + 54px)} }
@media (orientation:portrait) and (max-width:700px){ #rotateHint{display:block} }
@media (min-width:700px){ body.menu-open #toast{left:calc((100vw - min(440px,94vw)) / 2)} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="tank" aria-label="水族箱"></canvas>
  <div id="hud">
    <span class="pill coin" id="coinPill">💰 0</span>
    <span class="pill star" id="starPill">⭐ 0</span>
    <span class="pill" id="fishPill">🐟 0/0</span>
  </div>
  <div id="ctrls">
    <button id="modeFeed" class="on">🍤 餵食</button>
    <button id="modeLook">🔍 查看</button>
    <button id="musicBtn" title="背景音樂" aria-label="背景音樂">🎵</button>
    <button id="menuBtn" aria-haspopup="dialog">☰ 選單</button>
  </div>
  <div id="fishCard"></div>
  <p id="rotateHint">📱 把手機橫過來，水族箱會變大</p>
</div>
<div id="menuBack" hidden></div>
<aside id="menu" hidden role="dialog" aria-label="選單">
  <div class="menuHead"><b>🐠 夢幻水族箱</b><button id="menuClose" class="ghost">✕ 關閉</button></div>
  <nav id="tabs">
    <button data-tab="shop" class="on">魚店</button>
    <button data-tab="food">飼料</button>
    <button data-tab="decor">擺飾</button>
    <button data-tab="bg">背景</button>
    <button data-tab="mine">我的魚</button>
    <button data-tab="star">⭐星願</button>
  </nav>
  <div id="tab"></div>
</aside>
<div id="toast"></div>
<div id="welcome" class="modal" hidden><div class="box" role="dialog" aria-modal="true"><p id="welcomeMsg"></p><div class="big" id="welcomeAmt"></div><div class="row"><button id="welcomeOk" class="on">收下金幣</button></div></div></div>
<div id="saveBox" class="modal" hidden><div class="box" role="dialog" aria-modal="true"><p id="saveTitle"></p><a id="saveLink" class="bigLink" hidden target="_blank" rel="noopener">🔗 直接開啟新網站並帶入進度<small>最簡單，不用複製貼上</small></a><textarea id="saveText" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="存檔碼"></textarea><div class="row"><button class="ghost" id="saveCancel">關閉</button><button id="saveOk" class="on">複製</button></div></div></div>
<div id="ask" class="modal" hidden><div class="box" role="dialog" aria-modal="true"><p id="askMsg"></p><div class="row"><button class="ghost" id="askNo">取消</button><button id="askYes">確定</button></div></div></div>

<script>
'use strict';
// ====== 基本常數 ======
// 水族箱高度固定 620，寬度依螢幕比例調整，讓畫面剛好填滿螢幕
let W = 1000;
const H = 620, FLOOR = 555, TOP = 55, SLOT_Y = 598;
let SLOT_X = [];
const layoutSlots = () => { SLOT_X = [0, 1, 2, 3, 4, 5].map(i => Math.round(W * (.1 + .16 * i))); };
layoutSlots();
const SAVE_KEY = 'aquarium-save-v1';
// 在畫布上畫表情符號。一定要先把填色設回實心顏色：iPhone 的 Safari 會用當下的填色（例如金色光暈的漸層）
// 去填滿表情符號，結果只看到一團光、看不到圖案
function emoji(c, ch, x, y, size, baseline = 'middle') {
  c.fillStyle = '#000'; c.font = `${size}px ${EMOJI_FONT}`; c.textAlign = 'center'; c.textBaseline = baseline; c.fillText(ch, x, y);
}
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.floor(n).toLocaleString('zh-TW');
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function weighted(pool) { let t = pool.reduce((s, p) => s + p[1], 0), r = Math.random() * t; for (const p of pool) { if ((r -= p[1]) <= 0) return p[0]; } return pool[0][0]; }

// ====== 遊戲資料 ======
const TREASURE = {
  bubble:  { icon: '🫧', name: '泡泡珠',   value: 2 },
  coin:    { icon: '🔹', name: '海玻璃',   value: 5 },
  shell:   { icon: '🐚', name: '貝殼',     value: 12 },
  pearl:   { icon: '🦪', name: '珍珠貝',   value: 30 },
  crystal: { icon: '🔮', name: '水晶球',   value: 75 },
  crown:   { icon: '👑', name: '皇冠',     value: 200 },
  diamond: { icon: '💎', name: '鑽石',     value: 500 },
  vase:    { icon: '🏺', name: '古董花瓶', value: 1200 },
  gold:    { icon: '💍', name: '寶石戒指', value: 3000 },
  relic:   { icon: '🏆', name: '傳說寶杯', value: 8000 },
  key:     { icon: '🗝️', name: '黃金鑰匙', value: 20000 },
  trident: { icon: '🔱', name: '海神三叉戟', value: 60000 },
  orb:     { icon: '🔮', name: '龍宮寶珠', value: 150000 },
};

// 20 種魚，前期每級約 2.1 倍，越後面漲越多（最後約 3.3 倍）；寶物、成長、繁殖、放生星星等數值由 tierStats 自動計算
const SPECIES = [
  { id: 'guppy',      name: '孔雀魚',       price: 20,    size: 20, desc: '入門好養，繁殖快速', draw: drawGuppy },
  { id: 'neon',       name: '霓虹燈魚',     price: 42,    size: 18, desc: '身上的藍光閃閃發亮', draw: drawNeon },
  { id: 'clown',      name: '小丑魚',       price: 89,   size: 24, desc: '活潑可愛的人氣王', draw: drawClown },
  { id: 'blueclown',  name: '藍色小丑魚',   price: 190,   size: 24, desc: '少見的藍色小丑魚', draw: draw_blueclown },
  { id: 'jewel',      name: '寶石魔',       price: 410,   size: 22, desc: '深藍身上撒滿亮藍色寶石', draw: draw_jewel },
  { id: 'dottyback',  name: '蘭花擬雀鯛',   price: 910,   size: 22, desc: '像蘭花一樣的粉紫色', draw: draw_dottyback },
  { id: 'snowclown',  name: '雪花小丑魚',   price: 2000,   size: 25, desc: '條紋像雪花一樣不規則', draw: draw_snowclown },
  { id: 'clowntang',  name: '紋刺尾魚',     price: 4700,  size: 26, desc: '黃色身體配上藍色條紋', draw: draw_clowntang },
  { id: 'angel',      name: '神仙魚',       price: 11000,  size: 28, desc: '優雅的長鰭貴族', draw: drawAngel },
  { id: 'peppermint', name: '紅薄荷神仙魚', price: 27000,  size: 24, desc: '紅白條紋像薄荷糖', draw: draw_peppermint },
  { id: 'bluetang',   name: '藍倒吊',       price: 68000,  size: 28, desc: '寶藍色身體、黃色尾巴', draw: draw_bluetang },
  { id: 'betta',      name: '鬥魚',         price: 170000,  size: 26, desc: '華麗飄逸的大尾巴', draw: drawBetta },
  { id: 'parrot',     name: '鸚哥魚',       price: 460000,  size: 30, desc: '額頭圓鼓鼓的溫和大魚', draw: draw_parrot },
  { id: 'grouper',    name: '豹石斑',       price: 1300000,  size: 30, desc: '白底黑點像小豹子', draw: draw_grouper },
  { id: 'moorish',    name: '鐮魚',         price: 3500000, size: 30, desc: '拖著長長的背鰭絲', draw: draw_moorish },
  { id: 'french',     name: '法國神仙魚',   price: 10000000, size: 30, desc: '黑色身體鑲著金邊', draw: draw_french },
  { id: 'queen',      name: '紫后神仙魚',   price: 31000000, size: 30, desc: '紫色漸層到橘色的女王', draw: draw_queen },
  { id: 'arowana',    name: '金龍魚',       price: 95000000, size: 34, desc: '招財納福的風水魚', draw: drawArowana },
  { id: 'mahi',       name: '鬼頭刀',       price: 300000000, size: 32, desc: '大海裡閃耀的綠金色', draw: draw_mahi },
  { id: 'koi',        name: '錦鯉',         price: 1000000000, size: 34, desc: '帶來好運的傳說之魚', draw: drawKoi },
];
// 依「平均每次想產出的價值」組出寶物組合：主要兩種相鄰的寶物，再加 6% 機率的更高級寶物
function makePool(avg) {
  const TV = ['bubble', 'coin', 'shell', 'pearl', 'crystal', 'crown', 'diamond', 'vase', 'gold', 'relic', 'key', 'trident', 'orb'];
  let i = 0; while (i < TV.length - 2 && TREASURE[TV[i + 1]].value < avg) i++;
  const lo = TREASURE[TV[i]].value, hi = TREASURE[TV[i + 1]].value, wHi = clamp(Math.round((avg - lo) / (hi - lo) * 94), 5, 88);
  const pool = [[TV[i], 94 - wHi], [TV[i + 1], wHi]];
  if (i + 2 < TV.length) pool.push([TV[i + 2], 6]); else pool[1][1] += 6;
  return pool;
}
// 每一階的目標每秒產值（和價格分開設定：價格可以更陡，產值維持原本的成長速度）
const TIER_INCOME = [0.33, 0.5, 0.76, 1.15, 1.78, 2.82, 4.43, 7.11, 11.29, 18.55, 30.54, 49.39, 85.25, 142.79, 239.98, 417.82, 734.63, 1257.19, 2264.5, 4183.19];
function tierStats(k, price) {
  const q = k / (SPECIES.length - 1);
  const dropEvery = Math.round(8 + 9 * q);
  // 回本時間從約 1 分鐘逐級拉長到約 66 小時（不含繁殖），後期要慢慢存
  const income = TIER_INCOME[k], avg = income * dropEvery;
  const pool = makePool(avg);
  return {
    dropEvery, pool, income, stars: Math.max(1, Math.round(Math.pow(1.27, k))), speed: Math.round(70 - 25 * q),
    hungerRate: +(.55 + .4 * q).toFixed(2), growTime: Math.round(60 * Math.pow(8, q) / 10) * 10, breedTime: Math.round(180 * Math.pow(1.3, k) / 10) * 10,
  };
}
SPECIES.forEach((s, k) => Object.assign(s, tierStats(k, s.price)));
const SP = Object.fromEntries(SPECIES.map(s => [s.id, s]));

// 星願夢幻魚：用星星兌換，每種只能有一隻，水族箱最多展示 3 隻
// 星願夢幻生物：用星星兌換，每種只能有一隻，水族箱最多展示 3 隻
// income：目標每秒產值（基本值，不含擺飾與背景加成）；寶物價值倍率 valueMult 另外乘上
const STARFISH = [

function ribbon(c, pts, w0, col, alpha = .9) {
  const n = pts.length - 1, L = [], R = [];

  const base = Array.isArray(col) ? col : hex(col);
  for (let i = 0; i < n; i++) {
    polyFill(c, [pts[i], L[i], L[i + 1], pts[i + 1]], css(bright(base, .88), alpha));
    polyFill(c, [pts[i], R[i], R[i + 1], pts[i + 1]], css(bright(base, 1.08), alpha));
  }
}

function updateFish(f, dt) {

function updateBreeding(dt) {
  for (const sp of SPECIES) {
    const el = state.fish.filter(f => f.sp === sp.id && f.growth >= 1 && f.hunger >= 40);
    const pairs = Math.floor(el.length / 2);
    if (pairs < 1 || state.fish.length >= capacity()) continue;
    // 配對越多繁殖越快，但每多一對只加快 15%，最多 2 倍
    state.breedT[sp.id] = (state.breedT[sp.id] || 0) + dt * Math.min(2, 1 + .15 * (pairs - 1)) * B.breed;
    if (state.breedT[sp.id] >= sp.breedTime) {
      state.breedT[sp.id] = 0;
      const a = pick(el); let b = pick(el); if (b === a) b = el.find(x => x !== a);
      const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
      const baby = spawnFish(sp.id, x, y, 0, 60);
      for (let i = 0; i < 6; i++) particles.push({ x: x + rand(-20, 20), y: y + rand(-10, 10), vy: -rand(20, 45), life: 1.6, icon: '💗' });
      floatText(x, y - 25, `${sp.name}寶寶「${baby.name}」誕生了！`, '#ffb3d9');

function update(dt) {

  for (const f of starFish) updateStarFish(f, dt);

    const r = releasing[i]; r.life -= dt; r.f.y -= 70 * dt; r.f.x += r.f.vx * dt * .5; r.f.vy = -60;
    if (Math.random() < dt * 8) particles.push({ x: r.f.x + rand(-15, 15), y: r.f.y + rand(-10, 10), vy: -rand(10, 30), life: .8, icon: '⭐' });
    if (r.life <= 0) releasing.splice(i, 1);
  }
  updateBreeding(dt);
  // 飼料
  for (let i = pellets.length - 1; i >= 0; i--) {
    const p = pellets[i];
    if (p.y < FLOOR + 5) { p.y += 38 * dt; p.x += Math.sin(T * 2 + p.seed) * 12 * dt; }
    else { p.floor += dt; if (p.floor > 12) pellets.splice(i, 1); }
  }
  // 寶物
  for (let i = state.treasures.length - 1; i >= 0; i--) {
    const t = state.treasures[i];
    if (!t.landed) { t.vy = Math.min(90, t.vy + 80 * dt); t.y += t.vy * dt; if (t.y >= (t.floorY || (t.floorY = rand(FLOOR + 8, FLOOR + 45)))) { t.y = t.floorY; t.landed = true; } }
    else { t.age += dt; if (t.age > 120) state.treasures.splice(i, 1); }
  }
  // 自動餵食器
  if (state.feederLv > 0) {

    if (feederT >= feederInterval(state.feederLv)) {
      feederT = 0; const fd = FD[state.food];
      if (state.fish.some(f => f.hunger < 70) && state.coins >= fd.cost) { state.coins -= fd.cost; pellets.push(mkPellet(rand(60, W - 60), TOP - 20)); }
    }
  }

  if (state.snailLv > 0) {

    for (const t of state.treasures) if (t.landed) { const d = Math.abs(t.x - snail.x); if (d < bd) { bd = d; best = t; } }
    if (best) {

  for (let i = coinFx.length - 1; i >= 0; i--) {

  }

  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) particles.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.y -= 30 * dt; t.life -= dt; if (t.life <= 0) texts.splice(i, 1); }
  if (Math.random() < dt * 3) bubbles.push({ x: rand(20, W - 20), y: FLOOR, r: rand(1.5, 4), vy: rand(30, 70) });
  for (let i = bubbles.length - 1; i >= 0; i--) { const b = bubbles[i]; b.y -= b.vy * dt; b.x += Math.sin(T * 3 + b.r * 10) * 10 * dt; if (b.y < 5) bubbles.splice(i, 1); }
}

      const x = (i * 230 + T * 8) % (W + 100) - 50, y = 120 + i * 60 % 250 + Math.sin(T * .8 + i) * 25, pulse = 1 + Math.sin(T * 2 + i) * .1;
      const col = ['255,120,220', '120,200,255', '180,140,255'][i % 3];

      ctx.beginPath(); ctx.ellipse(x, y, 26 * pulse, 20, 0, Math.PI, 0); ctx.fill(); ctx.restore();
      ctx.strokeStyle = `rgba(${col},0.35)`; ctx.lineWidth = 2;

    }
  }
}

function drawDecor() {
  for (let i = 0; i < 6; i++) {
    const it = state.slots[i] && itemById(state.slots[i]), x = SLOT_X[i];
    const showEmpty = mode === 'look' || (menuOpen && tab === 'decor');
    if (!it) {
      if (showEmpty) {
        ctx.strokeStyle = i === selSlot && menuOpen && tab === 'decor' ? 'rgba(255,201,64,0.9)' : 'rgba(255,255,255,0.45)';
        ctx.setLineDash([6, 5]); ctx.lineWidth = 2; ell(ctx, x, SLOT_Y - 4, 40, 12); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('+', x, SLOT_Y - 4);
      }
      continue;
    }
    const d = DC[it.type], tier = TIERS[it.lv - 1], size = 46 + it.lv * 9;
    const g = ctx.createRadialGradient(x, SLOT_Y - 4, 2, x, SLOT_Y - 4, 55); g.addColorStop(0, tier.c + (it.lv >= 3 ? 'aa' : '66')); g.addColorStop(1, tier.c + '00');
    ctx.fillStyle = g; ell(ctx, x, SLOT_Y - 4, 55, 16); ctx.fill();
    ctx.save();
    if (it.lv >= 4) { ctx.shadowColor = tier.c; ctx.shadowBlur = 12 + Math.sin(T * 3) * 6; }
    emoji(ctx, d.icon, x, SLOT_Y + 6, size, 'bottom');
    ctx.restore();
    if (menuOpen && tab === 'decor' && i === selSlot) { ctx.strokeStyle = 'rgba(255,201,64,0.9)'; ctx.setLineDash([6, 5]); ctx.lineWidth = 2; ell(ctx, x, SLOT_Y - 4, 48, 14); ctx.stroke(); ctx.setLineDash([]); }
    if (it.lv >= 5 && Math.random() < .03) particles.push({ x: x + rand(-25, 25), y: SLOT_Y - rand(10, 50), vy: -15, life: 1.2, icon: '✨' });
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);

    const fd = FD[p.food]; ctx.globalAlpha = p.floor > 9 ? (12 - p.floor) / 3 : 1;
    const pc = hex(fd.color), P = []; for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + p.seed; P.push([p.x + Math.cos(a) * fd.r, p.y + Math.sin(a) * fd.r]); }
    P.forEach((q, k) => lpTri(ctx, [p.x, p.y], q, P[(k + 1) % 6], css(bright(pc, .8 + .45 * Math.max(0, -Math.sin(k * Math.PI / 3 + p.seed + .5))))));
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; circle(ctx, p.x - fd.r * .3, p.y - fd.r * .35, fd.r * .28); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of state.treasures) {
    const y = t.y + (t.landed ? Math.sin(T * 2 + t.bob) * 1.5 : 0);
    ctx.globalAlpha = t.age > 110 ? (120 - t.age) / 10 : 1;
    const g = ctx.createRadialGradient(t.x, y, 2, t.x, y, 22); g.addColorStop(0, 'rgba(255,230,120,0.55)'); g.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = g; ctx.fillRect(t.x - 22, y - 22, 44, 44);

  }
  const sorted = state.fish.slice().sort((a, b) => a.growth - b.growth);
  for (const f of sorted) drawFish(ctx, f, T);
  for (const f of starFish) drawFish(ctx, f, T);
  for (const r of releasing) drawFish(ctx, r.f, T, clamp(r.life / 1.6, 0, 1));
  if (state.snailLv > 0) {
    ctx.save(); ctx.translate(snail.x, FLOOR + 30); if (snail.dir > 0) ctx.scale(-1, 1);
    emoji(ctx, '🐌', 0, 0, 26 + state.snailLv * 4); ctx.restore();
  }
  if (state.feederLv > 0) emoji(ctx, '🤖', W - 30, 26, 26);
  for (const f of coinFx) {
    if (f.t < 0) continue;
    const q = f.t / f.dur, e = q * q * (3 - 2 * q), x = f.x0 + (40 - f.x0) * e, y = f.y0 + (-10 - f.y0) * e - Math.sin(Math.PI * q) * 90;
    drawCoin(ctx, x, y, 11 + f.tier * 2, f.tier, f.spin);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
  for (const b of bubbles) { ell(ctx, b.x, b.y, b.r, b.r); ctx.stroke(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of particles) { ctx.globalAlpha = Math.min(1, p.life); emoji(ctx, p.icon, p.x, p.y, 22); }
  ctx.globalAlpha = 1;
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life); ctx.font = 'bold 28px "Noto Sans TC","PingFang TC",sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(t.text, t.x, t.y); ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  // 水面
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 10 + Math.sin(x * .03 + T * 1.5) * 3);
  ctx.stroke();
}

// ====== 互動 ======
function floatText(x, y, text, color = '#ffd84d') { texts.push({ x, y, text, color, life: 1.5 }); }
let toastTimer;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800); }
function mkPellet(x, y) { return { x, y, food: state.food, floor: 0, seed: rand(0, 6) }; }

function collectTreasure(t) {
  const i = state.treasures.indexOf(t); if (i < 0) return;
  state.treasures.splice(i, 1);
  const v = Math.round(TREASURE[t.type].value * (t.mult || 1) * B.value);
  state.coins += v; state.earned += v;
  // 寶物變成金幣：價值越高，金幣越多、顏色從銅 → 銀 → 金
  const tier = v < 40 ? 0 : v < 400 ? 1 : 2, n = [2, 3, 5][tier];
  for (let k = 0; k < n; k++) coinFx.push({ x0: t.x + rand(-10, 10), y0: t.y + rand(-6, 6), t: -k * .07, dur: .85, tier, spin: rand(0, 6) });
  floatText(t.x, t.y - 22, `+${fmt(v)}`, COIN_COL[tier][1]);
  particles.push({ x: t.x, y: t.y, vy: -30, life: .45, icon: TREASURE[t.type].icon });
  for (let k = 0; k < 3; k++) particles.push({ x: t.x + rand(-10, 10), y: t.y, vy: -rand(30, 60), life: .8, icon: '✨' });
}
const COIN_COL = [['#a8672f', '#f0b27a'], ['#8f99aa', '#f2f5fa'], ['#d6960f', '#ffe27a']];
// 八角形的低多邊形金幣，會翻轉
function drawCoin(c, x, y, r, tier, spin) {
  const [d, l] = COIN_COL[tier], sx = Math.max(.25, Math.abs(Math.cos(spin)));
  c.save(); c.translate(x, y); c.scale(sx, 1);
  const P = []; for (let i = 0; i < 8; i++) { const a = Math.PI / 8 + i * Math.PI / 4; P.push([Math.cos(a) * r, Math.sin(a) * r]); }
  P.forEach((p, i) => { const q = P[(i + 1) % 8]; c.fillStyle = i < 4 ? d : l; c.beginPath(); c.moveTo(0, 0); c.lineTo(...p); c.lineTo(...q); c.closePath(); c.fill(); });
  c.fillStyle = l; circle(c, 0, 0, r * .62); c.fill();
  c.fillStyle = d; circle(c, r * .08, r * .08, r * .45); c.fill();
  c.fillStyle = l; circle(c, 0, 0, r * .42); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.8)'; c.beginPath(); c.moveTo(-r * .5, -r * .2); c.lineTo(-r * .2, -r * .55); c.lineTo(-r * .05, -r * .45); c.lineTo(-r * .38, -r * .08); c.fill();
  c.restore();
}
function worldPos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function treasureAt(p, rad = 30) {
  let best = null, bd = rad * rad;
  for (const t of state.treasures) { const d = (t.x - p.x) ** 2 + (t.y - p.y) ** 2; if (d < bd) { bd = d; best = t; } }
  return best;
}
let dragging = false;
canvas.addEventListener('pointerdown', e => {
  dragging = true; const p = worldPos(e);
  const t = treasureAt(p); if (t) { collectTreasure(t); return; }
  if (mode === 'feed') {
    const fd = FD[state.food];
    if (state.coins < fd.cost) { floatText(p.x, p.y, '金幣不足', '#ff8080'); return; }
    state.coins -= fd.cost; pellets.push(mkPellet(p.x, Math.max(TOP - 20, Math.min(p.y, FLOOR))));
    return;
  }
  // 查看模式：先找魚，再找擺飾位置
  let hit = null, hd = 1e9;
  for (const f of [...state.fish, ...starFish]) { const s = fishScale(f) * 1.4 + 8, d = Math.hypot(f.x - p.x, f.y - p.y); if (d < s && d < hd) { hd = d; hit = f; } }
  if (hit) { selFishId = hit.id; updateFishCard(); return; }
  if (!treasureAt(p, 60)) for (let i = 0; i < 6; i++) {
    const it = state.slots[i] && itemById(state.slots[i]), dx = Math.abs(p.x - SLOT_X[i]);
    const hitDecor = it ? dx < 34 && p.y > SLOT_Y - (40 + it.lv * 9) && p.y < SLOT_Y + 8 : dx < 36 && Math.abs(p.y - (SLOT_Y - 4)) < 16;
    if (hitDecor) { selSlot = i; setTab('decor'); openMenu(); return; }
  }
  selFishId = null; updateFishCard();
});
canvas.addEventListener('pointermove', e => { if (!dragging && e.pointerType !== 'mouse') return; const t = treasureAt(worldPos(e), 24); if (t && (dragging || e.buttons === 0)) collectTreasure(t); });

function setMode(m) {

  if (m === 'feed') { selFishId = null; updateFishCard(); }

}

$('#modeFeed').onclick = () => setMode('feed');

// 遊戲內的確認視窗（網頁版不支援瀏覽器的 confirm）
function ask(msg, yes = '確定', no = '取消') {

// ====== 匯出／匯入存檔 ======
// 存檔碼格式：AQ2:<長度>:<base64>。記下長度，才能判斷是不是只複製到一部分
// 匯出時會把沙地上還沒撿的寶物直接換成金幣、拿掉游動方向等暫時資料、數字四捨五入，讓存檔碼短一點比較好複製
function saveCode() {
  save();
  const d = JSON.parse(JSON.stringify(state));
  d.coins += d.treasures.reduce((a, t) => a + Math.round(TREASURE[t.type].value * (t.mult || 1) * B.value), 0);
  d.treasures = [];
  d.fish = d.fish.map(f => ({ id: f.id, sp: f.sp, name: f.name, x: f.x, y: f.y, hunger: f.hunger, growth: f.growth, foodMult: f.foodMult, dropT: f.dropT }));
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(d, (k, v) => typeof v === 'number' && !Number.isInteger(v) ? Math.round(v * 100) / 100 : v))));
  return `AQ2:${b64.length}:${b64}`;
}
// 盡量容錯：忽略空白與看不見的字元、全形冒號、前後多餘的文字
function parseCode(code) {
  const t = String(code || '').replace(/[\s ​-‍﻿]+/g, '').replace(/：/g, ':');
  if (!t) return { err: '還沒有貼上存檔碼。請長按輸入框，選「貼上」。' };
  const m = t.match(/AQ([12]):(?:(\d+):)?([A-Za-z0-9+/=_-]*)/);
  if (!m) return { err: '找不到存檔碼。請確認貼上的是「AQ」開頭的那一整串文字。' };
  let b = m[3].replace(/-/g, '+').replace(/_/g, '/').replace(/=+$/, '');
  const want = m[2] ? +m[2] : 0;
  if (want && m[3].length < want) return { err: `存檔碼不完整，只複製到大約 ${Math.max(1, Math.floor(m[3].length / want * 100))}%。\n請回到原本的遊戲，按「📋 複製」重新複製一次。` };
  while (b.length % 4) b += '=';
  try {
    const d = JSON.parse(decodeURIComponent(escape(atob(b))));
    if (d && typeof d.coins === 'number' && Array.isArray(d.fish)) return { data: d };
  } catch (e) { }
  return { err: '存檔碼看起來有缺字或多了字，沒辦法讀取。\n請回到原本的遊戲，按「📋 複製」重新複製一次。' };
}
function openSaveBox(title, text, okLabel, onOk, readOnly) {

  box.hidden = false; if (!readOnly) ta.focus();

}

const NEW_SITE = 'https://hn84786349.github.io/aquarium/';

// 賣魚最多拿回價格的 25%，而且不超過這隻魚大約 1 小時的產值，避免「繁殖後賣小魚」比養魚賺得還多
function sellPrice(f) { const sp = SP[f.sp]; return Math.floor(Math.min(sp.price * .25, sp.income * 3600) * (.2 + .8 * f.growth)); }
function releaseStars(f) { const st = SP[f.sp].stars; return f.growth >= 1 ? st : Math.floor(st * f.growth * .5); }
async function releaseFish(id) {
  let f = state.fish.find(x => x.id === id); if (!f) return;
  const st = releaseStars(f);
  if ((SP[f.sp].price >= 700 || st === 0) && !await ask(st ? `確定要放生「${f.name}」嗎？\n可以獲得 ⭐${st}` : `「${f.name}」還太小，放生拿不到星星，確定要放生嗎？`, '放生')) return;

}
function stageName(f) { return f.growth >= 1 ? '成魚' : f.growth < .35 ? '幼魚' : '亞成魚'; }
function updateFishCard() {

  buyBg(id) { const bg = BG[id]; if (pay(bg.starPrice || bg.price, !!bg.starPrice)) { state.ownedBg.push(id); ACTIONS.useBg(id); } },
  useBg(id) { state.bg = id; buildBg(); calcBonus(); toast(`背景換成「${BG[id].name}」`); },
  selSlot(i) { selSlot = +i; },
  buyDecor(type) {
    const sel = tabEl.querySelector(`select[data-tier="${type}"]`), lv = sel ? +sel.value : 1, d = DC[type];
    if (!pay(decorPrice(d, lv), d.star)) return;
    const it = { uid: 'd' + state.nextId++, type, lv }; state.decorItems.push(it);
    if (!state.slots[selSlot]) { state.slots[selSlot] = it.uid; toast(`${d.name}放到第 ${selSlot + 1} 格`); }
    else toast(`${d.name}已放進背包`);
    calcBonus();
  },
  upItem(uid) {
    const it = itemById(uid), d = DC[it.type]; if (it.lv >= 5) return;
    if (pay(decorPrice(d, it.lv + 1) - decorPrice(d, it.lv), d.star)) { it.lv++; calcBonus(); toast(`${d.name}升級到 Lv.${it.lv} ${TIERS[it.lv - 1].n}！`); }
  },
  place(uid) { state.slots[selSlot] = uid; calcBonus(); },
  unplace(uid) { const i = state.slots.indexOf(uid); if (i >= 0) state.slots[i] = null; calcBonus(); },
  sellItem(uid) {
    const it = itemById(uid), d = DC[it.type], v = Math.floor(decorPrice(d, it.lv) / 2);
    state.decorItems.splice(state.decorItems.indexOf(it), 1); state[d.star ? 'stars' : 'coins'] += v; toast(`賣出${d.name}，獲得 ${curIcon(d.star)}${fmt(v)}`);
  },
  viewFish(id) { setMode('look'); selFishId = +id; closeMenu(); updateFishCard(); },
  sellFish(id) { sellFish(+id); },
  releaseFish(id) { releaseFish(+id); },
  reset() { resetGame(); },
  exportSave() { exportSave(); },
  importSave() { importSave(); },
  fullscreen() { toggleFullscreen(); },
  buyStarFish(id) {
    if (state.starOwned.includes(id) || !pay(SSP[id].cost, true)) return;
    state.starOwned.push(id);
    if (state.starShown.length < MAX_SHOWN) { state.starShown.push(id); syncStarFish(); toast(`🌟 ${SSP[id].name}來到你的水族箱了！`); }
    else toast(`🌟 兌換了${SSP[id].name}！水族箱已放 ${MAX_SHOWN} 隻，先收回一隻才能放入`);
  },
  toggleShow(id) {
    const i = state.starShown.indexOf(id);
    if (i >= 0) { state.starShown.splice(i, 1); if (selFishId === 'star-' + id) selFishId = null; updateFishCard(); }
    else if (state.starShown.length < MAX_SHOWN && state.starOwned.includes(id)) state.starShown.push(id);
    else return toast(`最多只能放 ${MAX_SHOWN} 隻夢幻魚`);
    syncStarFish();
  },
};
tabEl.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  ACTIONS[b.dataset.act](b.dataset.arg); renderTab(); save();
});

// ====== 主迴圈 ======
let last = performance.now(), hudT = 0, saveT = 0, lastCoins = -1, lastFishN = -1, lastStars = -1;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  update(dt); render();
  hudT += dt; saveT += dt;
  if (state.coins !== lastCoins || state.fish.length !== lastFishN || state.stars !== lastStars) {
    if (state.fish.length !== lastFishN && menuOpen && tab === 'shop' && !panelPressed) setTimeout(renderTab, 0);
    lastCoins = state.coins; lastFishN = state.fish.length; lastStars = state.stars;
    $('#starPill').textContent = `⭐ ${fmt(state.stars)}`;
    $('#coinPill').textContent = `💰 ${fmt(state.coins)}`; $('#fishPill').textContent = `🐟 ${state.fish.length}/${capacity()}`;
  }
  if (hudT > .5) {
    hudT = 0; refreshAfford(); if (selFishId) updateFishCard();
    if (menuOpen && tab === 'mine' && !panelPressed && (T | 0) % 2 === 0) renderTab();
  }
  if (saveT > 5) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}

// ====== 離線收益 ======
// 離開期間魚兒照樣產寶，但只算正常速度的 30%，最多累積 2 小時；離開時不會肚子餓
const OFFLINE_RATE = 0.3, OFFLINE_MAX_H = 2;
const avgTreasure = pool => pool.reduce((a, [t, w]) => a + TREASURE[t].value * w, 0) / pool.reduce((a, p) => a + p[1], 0);
function incomePerSec() {
  let v = 0;
  for (const f of state.fish) if (f.growth >= 1) { const sp = SP[f.sp]; v += avgTreasure(sp.pool) / sp.dropEvery; }
  for (const id of state.starShown) { const sp = SSP[id]; v += avgTreasure(sp.pool) * sp.valueMult / sp.dropEvery; }
  return v * B.value * B.drop;
}
function fmtDur(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return h ? `${h} 小時${m ? ` ${m} 分鐘` : ''}` : `${Math.max(1, m)} 分鐘`;
}
let offlineShown = false;
function checkOffline() {
  const now = Date.now(), away = state.lastSeen ? (now - state.lastSeen) / 1000 : 0;
  state.lastSeen = now;
  if (away < 60 || offlineShown) return;
  const sec = Math.min(away, OFFLINE_MAX_H * 3600), amt = Math.floor(incomePerSec() * sec * OFFLINE_RATE * B.offline);
  if (amt < 1) return;
  offlineShown = true;
  $('#welcomeMsg').textContent = `歡迎回來！\n你離開了 ${fmtDur(away)}，魚兒們找到的寶物已經換成金幣${away > sec ? `\n（最多只能累積 ${OFFLINE_MAX_H} 小時）` : ''}：`;
  $('#welcomeAmt').textContent = `💰 ${fmt(amt)}`;
  $('#welcome').hidden = false;
  $('#welcomeOk').onclick = () => {
    $('#welcome').hidden = true; offlineShown = false;
    state.coins += amt; state.earned += amt; toast(`收下了 💰${fmt(amt)}`); save(); Music.start();
  };
}

// ====== 背景音樂（即時合成：柔和和弦 + 音樂盒旋律 + 海水聲 + 水滴與遠方鯨鳴） ======
const Music = (() => {
  const KEY = 'aquarium-music', BAR = 8;
  const CHORDS = [[48, 55, 64, 71], [45, 52, 60, 67], [41, 48, 57, 64], [43, 50, 59, 62]];
  const SCALE = [72, 74, 76, 79, 81, 84, 86, 88];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  let ac, master, wet, timer, nextBar = 0, nextNote = 0, nextDrop = 0, nextWhale = 0, bar = 0, playing = false, unlockEl;
  let wanted = true;
  try { wanted = localStorage.getItem(KEY) !== 'off'; } catch (e) { }
  // iPhone 靜音鍵會讓網頁音效沒聲音；先播放一段無聲的 <audio>，把音訊模式切成「播放」
  function silentWav() {
    const n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, str) => [...str].forEach((ch, i) => b[o + i] = ch.charCodeAt(0));
    w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
    let bin = ''; b.forEach(x => bin += String.fromCharCode(x)); return 'data:audio/wav;base64,' + btoa(bin);
  }
  function init() {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    ac = new AC();
    const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
    master = ac.createGain(); master.gain.value = 0; master.connect(comp);
    const verb = ac.createConvolver(), len = ac.sampleRate * 3.5, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    verb.buffer = ir; wet = ac.createGain(); wet.gain.value = .9; wet.connect(verb); verb.connect(master);
    // 海水聲：低通濾過的布朗噪音，濾波頻率緩慢起伏
    const nb = ac.createBuffer(1, ac.sampleRate * 4, ac.sampleRate), nd = nb.getChannelData(0); let last = 0;
    for (let i = 0; i < nd.length; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; nd[i] = last * 3.2; }
    const src = ac.createBufferSource(); src.buffer = nb; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
    const lfo = ac.createOscillator(), lfoG = ac.createGain(); lfo.frequency.value = .08; lfoG.gain.value = 200; lfo.connect(lfoG); lfoG.connect(lp.frequency);
    const ng = ac.createGain(); ng.gain.value = .22; src.connect(lp); lp.connect(ng); ng.connect(master); src.start(); lfo.start();
    return true;
  }
  function pad(chord, t) {
    for (const m of chord) for (const det of [-5, 5]) {
      const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = hz(m); o.detune.value = det; f.type = 'lowpass'; f.frequency.value = 900;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.018, t + 2.5); g.gain.setValueAtTime(.018, t + BAR - .5); g.gain.linearRampToValueAtTime(0, t + BAR + 2.5);
      o.connect(f); f.connect(g); g.connect(master); g.connect(wet); o.start(t); o.stop(t + BAR + 3);
    }
  }
  function bell(m, t, vol) {
    for (const [mul, v] of [[1, 1], [2, .25], [3.01, .08]]) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = hz(m) * mul;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + 2.8 / mul);
      o.connect(g); g.connect(master); g.connect(wet); o.start(t); o.stop(t + 3);
    }
  }
  function drop(t) {
    const o = ac.createOscillator(), g = ac.createGain(), f0 = rand(700, 1100);
    o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 2.2, t + .07);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.045, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + .18);
    o.connect(g); g.connect(master); g.connect(wet); o.start(t); o.stop(t + .25);
  }
  function whale(t) {
    const o = ac.createOscillator(), vib = ac.createOscillator(), vg = ac.createGain(), lp = ac.createBiquadFilter(), g = ac.createGain(), f0 = rand(150, 210);
    o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f0 * 1.7, t + 2.2); o.frequency.linearRampToValueAtTime(f0 * 1.2, t + 4.5);
    vib.frequency.value = 5; vg.gain.value = 5; vib.connect(vg); vg.connect(o.frequency);
    lp.type = 'lowpass'; lp.frequency.value = 650;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t + 1.2); g.gain.setValueAtTime(.05, t + 3.2); g.gain.linearRampToValueAtTime(0, t + 5);
    o.connect(lp); lp.connect(g); g.connect(wet); g.connect(master); o.start(t); vib.start(t); o.stop(t + 5.2); vib.stop(t + 5.2);
  }
  function tick() {
    const now = ac.currentTime;
    if (!nextDrop) { nextDrop = now + 3; nextWhale = now + 20; }
    while (nextDrop < now + 1.5) { drop(Math.max(now, nextDrop)); if (Math.random() < .3) drop(Math.max(now, nextDrop) + .12); nextDrop += rand(4, 10); }
    while (nextWhale < now + 1.5) { whale(Math.max(now, nextWhale)); nextWhale += rand(40, 75); }
    if (nextBar < now) nextBar = now + .1;
    if (nextNote < now) nextNote = now + .5;
    while (nextBar < now + 1.5) { pad(CHORDS[bar % 4], nextBar); nextBar += BAR; bar++; }
    while (nextNote < now + 1.5) {
      if (Math.random() < .72) { bell(pick(SCALE), nextNote, rand(.05, .09)); if (Math.random() < .2) bell(pick(SCALE) - 12, nextNote + .01, .05); }
      nextNote += pick([.75, 1.5, 1.5, 2.25, 3]);
    }
  }
  function start() {
    if (!wanted || playing) return;
    if (!ac && !init()) return;
    try { if (!unlockEl) { unlockEl = new Audio(silentWav()); unlockEl.loop = true; } unlockEl.play().catch(() => { }); } catch (e) { }
    ac.resume(); playing = true;
    master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(.5, ac.currentTime, 1.2);
    tick(); timer = setInterval(tick, 400); updateBtn();
  }
  function stop() {
    if (!playing) return; playing = false; clearInterval(timer);
    master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(0, ac.currentTime, .3);
    setTimeout(() => { if (!playing) { ac.suspend(); try { unlockEl && unlockEl.pause(); } catch (e) { } } }, 1200);
    updateBtn();
  }
  function updateBtn() { const b = $('#musicBtn'); b.textContent = wanted ? '🎵' : '🔇'; b.title = wanted ? '關閉背景音樂' : '開啟背景音樂'; b.classList.toggle('on', playing); }
  function toggle() { wanted = !wanted; try { localStorage.setItem(KEY, wanted ? 'on' : 'off'); } catch (e) { } wanted ? start() : stop(); toast(wanted ? '🎵 背景音樂開啟' : '🔇 背景音樂關閉'); }
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else if (wanted) setTimeout(start, 0); });
  return { start, toggle, updateBtn };
})();
$('#musicBtn').onclick = e => { e.stopPropagation(); Music.toggle(); };
// 瀏覽器規定要先點一下畫面才能播放聲音
for (const ev of ['pointerdown', 'touchend', 'keydown']) document.addEventListener(ev, () => Music.start(), { passive: true });

load(); syncStarFish(); calcBonus(); buildPreviews();
resize(); window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 200));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
updateModeLabel(); renderTab(); Music.updateBtn(); checkOffline(); save(); setTimeout(importFromLink, 300);
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else checkOffline(); });
requestAnimationFrame(frame);
</script>
</body>
</html>
