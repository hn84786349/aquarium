<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="夢幻水族箱">
<meta name="theme-color" content="#06101c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>夢幻水族箱</title>
<link rel="stylesheet" href="css/style.css?v=20261008">
</head>
<body>
<div id="stage">
  <canvas id="tank" aria-label="水族箱"></canvas>
  <div id="hud">
    <span class="pill coin" id="coinPill">💰 0</span>
    <span class="pill star" id="starPill">⭐ 0</span>
    <span class="pill" id="fishPill">🐟 0/0</span>
    <span class="pill" id="potionPill" hidden></span>
  </div>
  <div id="ctrls">
    <button id="modeFeed" class="on" aria-haspopup="true" aria-expanded="false">🍤 餵食</button>
    <button id="photoBtn" title="拍照" aria-label="拍照">📸</button>
    <button id="giftBtn" title="每日禮物" aria-label="每日禮物">🎁</button>
    <button id="popBtn" title="戳泡泡小遊戲" aria-label="戳泡泡小遊戲">🫧</button>
    <button id="musicBtn" title="背景音樂" aria-label="背景音樂">🎵</button>
    <button id="menuBtn" aria-haspopup="dialog">☰ 選單</button>
  </div>
  <div id="fishCard"></div>
  <div id="foodPop" hidden role="dialog" aria-label="選擇飼料"></div>
  <p id="rotateHint">📱 把手機橫過來，水族箱會變大</p>
</div>
<div id="menuBack" hidden></div>
<aside id="menu" hidden role="dialog" aria-label="選單">
  <div class="menuHead"><nav id="topTabs"><button data-top="store" class="on">🛒 商店</button><button data-top="mine">🐠 我的魚</button><button data-top="collect">🏆 收藏</button><button data-top="settings">⚙️ 設定</button></nav><button id="menuClose" class="ghost" aria-label="關閉">✕</button></div>
  <div id="wallet"><span>💰 <b id="wCoin">0</b></span><span>⭐ <b id="wStar">0</b></span></div>
  <nav id="tabs">
    <button data-tab="shop" class="on">魚</button>
    <button data-tab="star">⭐夢幻魚</button>
    <button data-tab="decor">設備・造景</button>
    <button data-tab="bg">背景</button>
    <button data-tab="starshop">✨小舖</button>
  </nav>
  <nav id="tabs2" hidden>
    <button data-tab="dex">📖 圖鑑</button>
    <button data-tab="ach">🏆 成就</button>
    <button data-tab="daily">📅 每日</button>
  </nav>
  <div id="tab"></div>
</aside>
<div id="toast"></div>
<div id="welcome" class="modal" hidden><div class="box" role="dialog" aria-modal="true"><p id="welcomeMsg"></p><div class="big" id="welcomeAmt"></div><p id="welcomeBorn"></p><div class="row"><button id="welcomeOk" class="on">收下金幣</button></div></div></div>
<div id="saveBox" class="modal" hidden><div class="box" role="dialog" aria-modal="true"><p id="saveTitle"></p><a id="saveLink" class="bigLink" hidden target="_blank" rel="noopener">🔗 直接開啟新網站並帶入進度<small>最簡單，不用複製貼上</small></a><textarea id="saveText" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="存檔碼"></textarea><div class="row"><button class="ghost" id="saveCancel">關閉</button><button id="saveOk" class="on">複製</button></div></div></div>
<div id="photoBox" class="modal" hidden><div class="box" role="dialog" aria-modal="true"><p>📸 拍好了！可以分享給家人，或長按照片儲存。</p><img id="photoImg" alt="水族箱照片"><div class="row"><button class="ghost" id="photoClose">關閉</button><button id="photoShare" class="on">分享</button></div></div></div>
<div id="nameBox" class="modal" hidden><div class="box" role="dialog" aria-modal="true"><p>✏️ 幫牠取個新名字（最多 8 個字）</p><input id="nameInput" maxlength="8" autocomplete="off"><div class="row"><button class="ghost" id="nameCancel">取消</button><button id="nameOk" class="on">確定</button></div></div></div>
<div id="flash"></div>
<div id="ask" class="modal" hidden><div class="box" role="dialog" aria-modal="true"><p id="askMsg"></p><div class="row"><button class="ghost" id="askNo">取消</button><button id="askYes">確定</button></div></div></div>

<!-- 遊戲程式依功能拆成多個檔案，順序不能換（後面的檔案會用到前面的東西） -->
<script src="js/core.js?v=20261008"></script>
<script src="js/scene.js?v=20261008"></script>
<script src="js/state.js?v=20261008"></script>
<script src="js/fish-base.js?v=20261008"></script>
<script src="js/fish-models.js?v=20261008"></script>
<script src="js/fish-models-2.js?v=20261008"></script>
<script src="js/fish-draw.js?v=20261008"></script>
<script src="js/dream-fish-2.js?v=20261008"></script>
<script src="js/data.js?v=20261008"></script>
<script src="js/update.js?v=20261008"></script>
<script src="js/render.js?v=20261008"></script>
<script src="js/input.js?v=20261008"></script>
<script src="js/cloud.js?v=20261008"></script>
<script src="js/ui.js?v=20261008"></script>
<script src="js/features.js?v=20261008"></script>
<script src="js/star-shop.js?v=20261008"></script>
<script src="js/loop.js?v=20261008"></script>
<script src="js/music.js?v=20261008"></script>
<script src="js/main.js?v=20261008"></script>
</body>
</html>
