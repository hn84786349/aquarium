<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="夢幻水族箱">
<meta name="theme-color" content="#06101c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>夢幻水族箱</title>
<style>
:root{
  color-scheme:dark;
  --bg:#06101c; --panel:#13243a; --panel2:#1a3150; --text:#eef4ff; --muted:#a3b8d4;
  --accent:#ffc940; --good:#4cd98b; --bad:#ff6b6b; --border:#2c4a70; --btn:#2a5a8f; --btnh:#3570b0;
  --glass:rgba(8,20,36,.62);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-size:17px;line-height:1.45;overflow:hidden;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;font:inherit;font-size:16px;color:var(--text);background:var(--btn);border:1px solid transparent;border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer}
button:hover:not(:disabled){background:var(--btnh)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:var(--accent);color:#2a1d00;font-weight:700}
button.ghost{background:transparent;border-color:var(--border)}
button.star{background:#5a3d9a}
button.star:hover:not(:disabled){background:#7050b8}
/* 整個畫面就是水族箱 */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
canvas{display:block;touch-action:none;cursor:pointer}
/* 浮在水族箱上的資訊與按鈕 */
#hud,#ctrls{position:absolute;top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;z-index:5}
#hud{left:max(8px,env(safe-area-inset-left));pointer-events:none}
#ctrls{right:max(8px,env(safe-area-inset-right));justify-content:flex-end}
.pill{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-size:17px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.coin{color:var(--accent)}
.pill.star{color:#fff27a}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.pill.bump{animation:bump .3s ease-out}
#ctrls button{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-color:rgba(255,255,255,.16);white-space:nowrap}
#ctrls button.on{background:var(--accent);color:#2a1d00;border-color:var(--accent)}
#ctrls button.view{background:#6ec3ff;color:#04223a;border-color:#6ec3ff;font-weight:700}
#menuBtn{font-weight:700;padding-inline:16px}
/* 選單面板：從右側滑出 */
#menuBack{position:fixed;inset:0;background:rgba(3,8,16,.45);z-index:10}
#menuBack[hidden],#menu[hidden]{display:none}
#menu{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:var(--panel);border-left:1px solid var(--border);z-index:11;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-right:env(safe-area-inset-right);box-shadow:-12px 0 40px rgba(0,0,0,.45);animation:slideIn .22s ease-out}
@keyframes slideIn{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
.menuHead{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 16px;border-bottom:1px solid var(--border)}
.menuHead b{font-size:19px;flex:1}
/* 上層分頁（商店／我的魚）放在標題列，下層是商店的子分頁 */
#topTabs{flex:1;display:flex;gap:6px;border:0}
#topTabs button{flex:none;border-radius:10px;background:transparent;border:1px solid var(--border);font-size:17px;font-weight:700;padding:6px 14px}
#topTabs button.on{background:var(--accent);color:#2a1d00;border-color:var(--accent)}
#tabs[hidden]{display:none}
/* 餵食按鈕按下去出現的飼料選單 */
#foodPop{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 54px);right:max(8px,env(safe-area-inset-right));z-index:7;width:min(360px,calc(100% - 16px));max-height:calc(100% - 70px);overflow-y:auto;
  background:rgba(10,20,35,.96);border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#foodPop[hidden]{display:none}
#foodPop .fh{font-weight:700;font-size:17px;margin:2px 4px 8px}
#foodPop button.food{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:6px;background:var(--panel2);border:2px solid transparent;padding:6px 10px}
#foodPop button.food.on{border-color:var(--accent);background:#2a3f60}
#foodPop button.food .fi{font-size:26px;width:34px;text-align:center}
#foodPop button.food small{display:block;color:var(--muted);font-size:14px}
#foodPop .hint{font-size:14px;margin:6px 4px 2px}
nav{display:flex;border-bottom:1px solid var(--border)}
nav button{flex:1;border-radius:0;background:transparent;padding:10px 2px;font-size:16px;white-space:nowrap;letter-spacing:-.3px}
nav button.on{background:var(--panel2);color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
#tab{overflow-y:auto;padding:12px 14px;flex:1;-webkit-overflow-scrolling:touch}
/* 橫向手機高度很矮：標題列、分頁縮小，讓內容有更多空間 */
@media (max-height:500px){
  .menuHead{padding:4px 8px 4px 12px}
  .menuHead b{font-size:16px}
  .menuHead button{min-height:36px;padding:4px 10px;font-size:15px}
  #topTabs button{padding:4px 12px;font-size:16px}
  #foodPop{top:calc(max(8px,env(safe-area-inset-top)) + 46px);max-height:calc(100% - 56px)}
  #foodPop button.food{min-height:40px;padding:3px 10px}
  nav button{min-height:38px;padding:4px 1px}
  #tab{padding:8px 10px}
}
.hint{color:var(--muted);font-size:15px;margin:6px 2px}
h3{margin:4px 0 10px;font-size:19px}
h4{margin:16px 0 8px;font-size:16px;color:var(--muted)}
.card{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card small{color:var(--muted);font-size:14px}
.card small.own{color:var(--text)}
.capBox{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:17px}
.capBox small{font-size:14px}
/* 魚店的數量框：往下滑時固定在最上面 */
.capBox.sticky{position:sticky;top:-8px;z-index:5;box-shadow:0 -6px 0 6px var(--panel),0 6px 12px rgba(0,0,0,.45)}
.card small.own b{color:var(--accent)}
.card small .relstar{color:#fff27a;white-space:nowrap}
.card img{width:92px;height:55px;flex:none}
.ico{font-size:32px;width:46px;text-align:center;flex:none}
.swatch{width:72px;height:48px;border-radius:6px;flex:none;border:1px solid var(--border)}
.bar{height:8px;background:#0a1320;border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--good)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fishrow>span{flex-basis:100%!important}
/* 造景卡片：上面是預覽與說明，下面是外觀選擇與升級按鈕 */
.card.scene{flex-direction:column;align-items:stretch}
.card.scene .top{flex-wrap:nowrap;align-items:center}
.card.scene .bottom{justify-content:space-between}
.card img.thumb{width:112px;height:67px;border-radius:8px;border:1px solid var(--border)}
.looks{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.looks span{font-size:14px;color:var(--muted);margin-right:2px}
button.chip{min-height:38px;min-width:38px;padding:4px 8px;font-size:15px;background:var(--panel);border:1px solid var(--border)}
button.chip.on{background:var(--accent);color:#2a1d00;font-weight:700;border-color:var(--accent)}
select{font:inherit;font-size:15px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px;min-height:38px}
.bonus{font-size:14px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:10px;line-height:1.75}
.bonus b{color:var(--good)}
.tier{font-weight:700}
#fishCard{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));background:rgba(10,20,35,.94);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:230px;max-width:calc(100% - 20px);font-size:15px;display:none;z-index:6}
#fishCard b{font-size:17px}
.modal{position:fixed;inset:0;background:rgba(3,8,16,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.modal .box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px 22px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.modal p{margin:0 0 16px;line-height:1.65;white-space:pre-line;font-size:18px}
.modal .row{justify-content:flex-end}
.bigLink{display:block;background:var(--accent);color:#2a1d00;font-weight:800;font-size:18px;text-align:center;text-decoration:none;padding:12px 14px;border-radius:12px;margin:0 0 14px}
.bigLink small{display:block;font-weight:500;font-size:14px;margin-top:2px}
.modal textarea{width:100%;min-height:96px;font:inherit;font-size:14px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:12px;word-break:break-all;resize:vertical}
.modal .big{font-size:30px;font-weight:800;color:var(--accent);text-align:center;margin:4px 0 14px}
#toast{position:fixed;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 56px));transform:translateX(-50%);background:rgba(10,20,35,.95);border:1px solid var(--accent);color:var(--text);padding:10px 18px;font-size:17px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.pill.bump{animation:none}#menu{animation:none}}
/* 小螢幕（手機）：按鈕只留圖示與價格，字稍微縮小 */
@media (max-width:700px),(max-height:500px){
  .pill{padding:4px 10px;font-size:16px}
  #ctrls button{padding:4px 10px;min-height:40px;font-size:16px}
  .lbl{display:none}
  #menu{width:min(420px,100vw)}
  .card{padding:8px;gap:8px}
  .card img{width:66px;height:40px}
  .card img.thumb{width:96px;height:57px}
  .ico{font-size:26px;width:38px}
  .card button,.card select{font-size:15px;padding:6px 9px;min-height:40px}
  nav button{font-size:15px;padding:8px 1px}
  #fishCard{min-width:190px;font-size:14px;padding:8px 10px}
  #fishCard button{padding:5px 9px;min-height:38px}
  .modal p{font-size:17px;margin-bottom:10px}
  .modal .big{font-size:26px;margin-bottom:8px}
}
#rotateHint{display:none;position:absolute;left:16px;right:16px;bottom:max(24px,env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:16px}
@media (max-width:520px){ #hud{top:calc(max(8px,env(safe-area-inset-top)) + 54px)} }
@media (orientation:portrait) and (max-width:700px){ #rotateHint{display:block} }
@media (min-width:700px){ body.menu-open #toast{left:calc((100vw - min(440px,94vw)) / 2)} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="tank" aria-label="水族箱"></canvas>
  <div id="hud">
    <span class="pill coin" id="coinPill">💰 0</span>
    <span class="pill star" id="starPill">⭐ 0</span>
    <span class="pill" id="fishPill">🐟 0/0</span>
  </div>
  <div id="ctrls">
    <button id="modeFeed" class="on" aria-haspopup="true" aria-expanded="false">🍤 餵食</button>
    <button id="musicBtn" title="背景音樂" aria-label="背景音樂">🎵</button>
    <button id="menuBtn" aria-haspopup="dialog">☰ 選單</button>
  </div>
  <div id="fishCard"></div>
  <div id="foodPop" hidden role="dialog" aria-label="選擇飼料"></div>
  <p id="rotateHint">📱 把手機橫過來，水族箱會變大</p>
</div>
<div id="menuBack" hidden></div>
<aside id="menu" hidden role="dialog" aria-label="選單">
  <div class="menuHead"><nav id="topTabs"><button data-top="store" class="on">🛒 商店</button><button data-top="mine">🐠 我的魚</button><button data-top="settings">⚙️ 設定</button></nav><button id="menuClose" class="ghost">✕ 關閉</button></div>
  <nav id="tabs">
    <button data-tab="shop" class="on">魚</button>
    <button data-tab="star">⭐夢幻魚</button>
    <button data-tab="decor">設備・造景</button>
    <button data-tab="bg">背景</button>
  </nav>
  <div id="tab"></div>
</aside>
<div id="toast"></div>
<div id="welcome" class="modal" hidden><div class="box" role="dialog" aria-modal="true"><p id="welcomeMsg"></p><div class="big" id="welcomeAmt"></div><div class="row"><button id="welcomeOk" class="on">收下金幣</button></div></div></div>
<div id="saveBox" class="modal" hidden><div class="box" role="dialog" aria-modal="true"><p id="saveTitle"></p><a id="saveLink" class="bigLink" hidden target="_blank" rel="noopener">🔗 直接開啟新網站並帶入進度<small>最簡單，不用複製貼上</small></a><textarea id="saveText" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="存檔碼"></textarea><div class="row"><button class="ghost" id="saveCancel">關閉</button><button id="saveOk" class="on">複製</button></div></div></div>
<div id="ask" class="modal" hidden><div class="box" role="dialog" aria-modal="true"><p id="askMsg"></p><div class="row"><button class="ghost" id="askNo">取消</button><button id="askYes">確定</button></div></div></div>

<script>
'use strict';
// ====== 基本常數 ======
// 水族箱高度固定 620，寬度依螢幕比例調整，讓畫面剛好填滿螢幕
let W = 1000;
const H = 620, FLOOR = 555, TOP = 55;
const SAVE_KEY = 'aquarium-save-v1';
// 在畫布上畫表情符號。一定要先把填色設回實心顏色：iPhone 的 Safari 會用當下的填色（例如金色光暈的漸層）
// 去填滿表情符號，結果只看到一團光、看不到圖案
function emoji(c, ch, x, y, size, baseline = 'middle') {
  c.fillStyle = '#000'; c.font = `${size}px ${EMOJI_FONT}`; c.textAlign = 'center'; c.textBaseline = baseline; c.fillText(ch, x, y);
}
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// 大數字改用「億」「兆」表示，比較好讀（例如 3.8億）
const fmt = n => {
  n = Math.floor(n); if (n < 1e8) return n.toLocaleString('zh-TW');
  const [d, u] = n < 1e12 ? [1e8, '億'] : [1e12, '兆'], v = n / d;
  return (v < 100 ? +v.toFixed(2) : v < 1000 ? +v.toFixed(1) : Math.floor(v).toLocaleString('zh-TW')) + u;
};
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function weighted(pool) { let t = pool.reduce((s, p) => s + p[1], 0), r = Math.random() * t; for (const p of pool) { if ((r -= p[1]) <= 0) return p[0]; } return pool[0][0]; }

// ====== 遊戲資料 ======
const TREASURE = {
  bubble:  { icon: '🫧', name: '泡泡珠',   value: 2 },
  coin:    { icon: '🔹', name: '海玻璃',   value: 5 },
  shell:   { icon: '🐚', name: '貝殼',     value: 12 },
  pearl:   { icon: '🦪', name: '珍珠貝',   value: 30 },
  crystal: { icon: '🔮', name: '水晶球',   value: 75 },
  crown:   { icon: '👑', name: '皇冠',     value: 200 },
  diamond: { icon: '💎', name: '鑽石',     value: 500 },
  vase:    { icon: '🏺', name: '古董花瓶', value: 1200 },
  gold:    { icon: '💍', name: '寶石戒指', value: 3000 },
  relic:   { icon: '🏆', name: '傳說寶杯', value: 8000 },
  key:     { icon: '🗝️', name: '黃金鑰匙', value: 20000 },
  trident: { icon: '🔱', name: '海神三叉戟', value: 60000 },
  orb:     { icon: '🔮', name: '龍宮寶珠', value: 150000 },
  starstone: { icon: '🌟', name: '星辰寶石', value: 400000 },
  heart:   { icon: '💖', name: '海洋之心', value: 1000000 },
};
const avgTreasure = pool => pool.reduce((a, [t, w]) => a + TREASURE[t].value * w, 0) / pool.reduce((a, p) => a + p[1], 0);

// 用 MODELS 裡的設定畫魚
function mdl(id) { return (c, s, w, e, f) => drawModel(c, s, w, e, f, MODELS[id]); }
// 40 種魚（包含海龜、海豚、鯨魚等海洋生物），越後面越華麗夢幻；價格、產值、成長、繁殖等數值由 tierStats 自動計算
const SPECIES = [
  { id: 'guppy',      name: '孔雀魚',       size: 20, desc: '入門好養，繁殖快速', draw: drawGuppy },
  { id: 'neon',       name: '霓虹燈魚',     size: 18, desc: '身上的藍光閃閃發亮', draw: drawNeon },
  { id: 'goldfish',   name: '琉金',         size: 22, desc: '圓滾滾的身體配上飄逸大尾巴', draw: mdl('goldfish') },
  { id: 'clown',      name: '小丑魚',       size: 24, desc: '活潑可愛的人氣王', draw: drawClown },
  { id: 'puffer',     name: '河豚',         size: 20, desc: '緊張時會鼓成一顆刺刺球', draw: mdl('puffer') },
  { id: 'blueclown',  name: '藍色小丑魚',   size: 24, desc: '少見的藍色小丑魚', draw: draw_blueclown },
  { id: 'jewel',      name: '寶石魔',       size: 22, desc: '深藍身上撒滿亮藍色寶石', draw: draw_jewel },
  { id: 'boxfish',    name: '黃金箱魨',     size: 19, desc: '方方正正的黃色小盒子', draw: mdl('boxfish') },
  { id: 'dottyback',  name: '蘭花擬雀鯛',   size: 22, desc: '像蘭花一樣的粉紫色', draw: draw_dottyback },
  { id: 'butterfly',  name: '月眉蝶',       size: 22, desc: '戴著黑色眼罩的黃色蝴蝶魚', draw: mdl('butterfly') },
  { id: 'snowclown',  name: '雪花小丑魚',   size: 25, desc: '條紋像雪花一樣不規則', draw: draw_snowclown },
  { id: 'clowntang',  name: '紋刺尾魚',     size: 26, desc: '黃色身體配上藍色條紋', draw: draw_clowntang },
  { id: 'seahorse',   name: '海馬',         size: 24, desc: '直立著慢慢游的海中小馬', draw: drawSeahorse },
  { id: 'angel',      name: '神仙魚',       size: 28, desc: '優雅的長鰭貴族', draw: drawAngel },
  { id: 'mandarin',   name: '青蛙魚',       size: 21, desc: '全身布滿迷幻的彩色花紋', draw: mdl('mandarin') },

// 依「平均每次想產出的價值」組出寶物組合：主要兩種相鄰的寶物，再加 6% 機率的更高級寶物
function makePool(avg) {
  const TV = ['bubble', 'coin', 'shell', 'pearl', 'crystal', 'crown', 'diamond', 'vase', 'gold', 'relic', 'key', 'trident', 'orb', 'starstone', 'heart'];
  let i = 0; while (i < TV.length - 2 && TREASURE[TV[i + 1]].value < avg) i++;
  const lo = TREASURE[TV[i]].value, hi = TREASURE[TV[i + 1]].value, wHi = clamp(Math.round((avg - lo) / (hi - lo) * 94), 5, 88);
  const pool = [[TV[i], 94 - wHi], [TV[i + 1], wHi]];
  if (i + 2 < TV.length) pool.push([TV[i + 2], 6]); else pool[1][1] += 6;
  return pool;
}
// 價格取兩位有效數字，看起來比較整齊
const nice = n => { const p = Math.pow(10, Math.floor(Math.log10(n)) - 1); return Math.round(n / p) * p; };
// 每一階：產值每階成長 ×1.38（前期）→ ×1.7（後期），回本時間從 1.5 分鐘慢慢拉長到約 60 小時；
// 越後面的魚產值跳得越多，買到第一隻後，第二隻會比較快買到
// 模擬結果：前期每 1～2 分鐘就能買下一種，中期約 10～30 分鐘，最後幾種約 4～6 小時（實際遊玩約一兩天）
function tierStats(k) {
  const n = SPECIES.length - 1, q = k / n;
  let income = .33; for (let i = 1; i <= k; i++) income *= 1.38 + .32 * (i / n) ** 2;
  const price = k ? nice(income * 90 * Math.pow(216000 / 90, Math.pow(q, 1.3))) : 20;
  const dropEvery = Math.round(8 + 9 * q), avg = income * dropEvery, pool = makePool(avg);
  return {
    price, income, dropEvery, pool, mult: avg / avgTreasure(pool),
    // 放生得到的星星：跟價格掛鉤（孔雀魚 1 顆，最貴的魚約 400 顆）
    stars: Math.max(1, Math.round(Math.pow(price / 20, .256))), speed: Math.round(70 - 25 * q),
    hungerRate: +(.55 + .4 * q).toFixed(2), growTime: Math.round(60 * Math.pow(10, q) / 10) * 10,
    // 繁殖時間：3 分鐘 → 最高級約 6 小時
    breedTime: Math.round(180 * Math.pow(120, q) / 10) * 10,
  };
}

function mound(c, w, h, seed, rocks = 2) {
  const r = mulberry(seed), n = 7, top = [], [s0, s1] = SC.sand;
  for (let i = 0; i <= n; i++) { const t = i / n; top.push([-w + 2 * w * t, -h * Math.pow(Math.sin(Math.PI * t), .8) * (i && i < n ? .85 + r() * .3 : 0)]); }
  for (let i = 0; i < n; i++) {
    const a = top[i], b = top[i + 1], m = [(a[0] + b[0]) / 2 + (r() - .5) * 6, 8];
    lpTri(c, a, b, m, css(bright(mixc(s0, s1, .2 + r() * .3), i < n / 2 ? 1.08 : .95)));
    lpTri(c, a, m, [a[0], 8], css(bright(mixc(s0, s1, .45), 1)));
    lpTri(c, b, [b[0], 8], m, css(bright(mixc(s0, s1, .45), .97)));
  }
  for (let i = 0; i < rocks; i++) lpRock(c, r, (r() - .5) * w * 1.3, 3 + r() * 3, 5 + r() * 6, SC.rock);
}

// ---- 珊瑚礁 ----
function coralBranch(c, x, y, len, ang, w, depth, col, k = 1) {
  const a = ang + Math.sin(T * 1.1 + x * .05 + depth) * .04;
  const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len, nx = -Math.sin(a), ny = Math.cos(a), w2 = w * .72;
  tpoly(c, [[x + nx * w / 2, y + ny * w / 2], [x, y], [x2, y2], [x2 + nx * w2 / 2, y2 + ny * w2 / 2]], col, .84 * k);

// ====== 更新 ======
function nearestPellet(f) {
  let best = null, bd = 1e9;
  for (const p of pellets) { const d = (p.x - f.x) ** 2 + (p.y - f.y) ** 2; if (d < bd) { bd = d; best = p; } }
  return best;
}
function updateStarFish(f, dt) {
  const sp = SSP[f.sp];

  const dx = f.tx - f.x, dy = f.ty - f.y, d = Math.hypot(dx, dy) || 1, k = Math.min(1, dt * 1.8);
  f.vx += (dx / d * sp.speed - f.vx) * k; f.vy += (dy / d * sp.speed * .6 - f.vy) * k;
  f.x = clamp(f.x + f.vx * dt, 40, W - 40); f.y = clamp(f.y + f.vy * dt, TOP + 10, FLOOR - 30);
  if (f.vx > 8) f.face = 1; else if (f.vx < -8) f.face = -1;
  if (Math.random() < dt * 1.5) particles.push({ x: f.x + rand(-20, 20), y: f.y + rand(-15, 15), vy: -rand(8, 20), life: 1, icon: '✨' });
  f.dropT -= dt * B.drop;
  if (f.dropT <= 0) {
    f.dropT = sp.dropEvery * rand(.8, 1.2);
    state.treasures.push({ x: f.x, y: f.y + 10, type: weighted(sp.pool), mult: sp.mult, vy: 0, landed: false, age: 0, bob: rand(0, 6) });
  }
}
function syncStarFish() {
  starFish = state.starShown.map(id => starFish.find(f => f.sp === id) || {
    id: 'star-' + id, sp: id, name: SSP[id].name, x: rand(100, W - 100), y: TOP, vx: 0, vy: 0, tx: rand(100, W - 100), ty: rand(150, 400),
    hunger: 100, growth: 1, foodMult: 1, dropT: SSP[id].dropEvery * rand(.3, .8), face: 1, phase: rand(0, 6.28), wanderT: 0,
  });
}
function updateFish(f, dt) {
  const sp = SP[f.sp], s = fishScale(f);
  f.hunger = Math.max(0, f.hunger - sp.hungerRate * B.hunger * dt);
  let speed = sp.speed * (f.growth < .35 ? 1.15 : 1), target = null;
  if (f.hunger < 85 && pellets.length) { target = nearestPellet(f); }
  if (target) { f.tx = target.x; f.ty = target.y; speed *= 1.8; }
  else {
    f.wanderT -= dt;
    if (f.wanderT <= 0 || Math.hypot(f.tx - f.x, f.ty - f.y) < 15) {
      f.tx = rand(40, W - 40); f.ty = rand(TOP + 10, FLOOR - 25); f.wanderT = rand(3, 8);
    }
    if (f.hunger <= 0) speed *= .45;
  }
  const dx = f.tx - f.x, dy = f.ty - f.y, d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, dt * 2.2);
  f.vx += (dx / d * speed - f.vx) * k; f.vy += (dy / d * speed * .7 - f.vy) * k;
  f.x = clamp(f.x + f.vx * dt, 30, W - 30); f.y = clamp(f.y + f.vy * dt, TOP, FLOOR - 15);
  if (f.vx > 8) f.face = 1; else if (f.vx < -8) f.face = -1;
  if (target && Math.hypot(target.x - f.x, target.y - f.y) < s * .8 + 8) {

function updateBreeding(dt) {
  for (const sp of SPECIES) {
    const el = state.fish.filter(f => f.sp === sp.id && f.growth >= 1 && f.hunger >= 40);
    const pairs = Math.floor(el.length / 2);
    if (pairs < 1 || state.fish.length >= capacity()) continue;
    // 配對越多繁殖越快，但每多一對只加快 15%，最多 2 倍
    state.breedT[sp.id] = (state.breedT[sp.id] || 0) + dt * Math.min(2, 1 + .15 * (pairs - 1)) * B.breed;
    if (state.breedT[sp.id] >= sp.breedTime) {
      state.breedT[sp.id] = 0;
      const a = pick(el); let b = pick(el); if (b === a) b = el.find(x => x !== a);
      const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
      const baby = spawnFish(sp.id, x, y, nurseryGrowth(), 60);
      for (let i = 0; i < 6; i++) particles.push({ x: x + rand(-20, 20), y: y + rand(-10, 10), vy: -rand(20, 45), life: 1.6, icon: '💗' });
      floatText(x, y - 25, `${sp.name}寶寶「${baby.name}」誕生了！`, '#ffb3d9');
      toast(`🎉 ${sp.name}生了小魚！`);
      if (menuOpen && tab === 'mine') renderTab();
    }
  }
}

function update(dt) {
  T += dt;
  for (const f of state.fish) updateFish(f, dt);
  for (const f of starFish) updateStarFish(f, dt);
  for (let i = releasing.length - 1; i >= 0; i--) {
    const r = releasing[i]; r.life -= dt; r.f.y -= 70 * dt; r.f.x += r.f.vx * dt * .5; r.f.vy = -60;
    if (Math.random() < dt * 8) particles.push({ x: r.f.x + rand(-15, 15), y: r.f.y + rand(-10, 10), vy: -rand(10, 30), life: .8, icon: '⭐' });
    if (r.life <= 0) releasing.splice(i, 1);
  }
  updateBreeding(dt);
  // 飼料
  for (let i = pellets.length - 1; i >= 0; i--) {
    const p = pellets[i];
    if (p.y < FLOOR + 5) { p.y += 38 * dt; p.x += Math.sin(T * 2 + p.seed) * 12 * dt; }
    else { p.floor += dt; if (p.floor > 12) pellets.splice(i, 1); }
  }
  // 寶物
  for (let i = state.treasures.length - 1; i >= 0; i--) {
    const t = state.treasures[i];
    if (!t.landed) { t.vy = Math.min(90, t.vy + 80 * dt); t.y += t.vy * dt; if (t.y >= (t.floorY || (t.floorY = rand(FLOOR + 8, FLOOR + 45)))) { t.y = t.floorY; t.landed = true; } }
    else { t.age += dt; if (t.age > 120) state.treasures.splice(i, 1); }
  }
  // 自動餵食器
  if (state.feederLv > 0) {
    feederT += dt;
    if (feederT >= feederInterval(state.feederLv)) {
      feederT = 0; const fd = FD[state.food];
      if (state.fish.some(f => f.hunger < 70) && state.coins >= fd.cost) { state.coins -= fd.cost; pellets.push(mkPellet(rand(60, W - 60), TOP - 20)); }
    }
  }
  // 蝸牛
  // 蝸牛：兩隻的時候各自負責半邊
  const nS = snailCount();
  for (let i = 0; i < nS; i++) {
    const sn = snails[i], lo = nS > 1 && i === 1 ? W / 2 : 0, hi = nS > 1 && i === 0 ? W / 2 : W;
    let best = null, bd = 1e9;
    for (const t of state.treasures) if (t.landed && t.x >= lo && t.x < hi) { const d = Math.abs(t.x - sn.x); if (d < bd) { bd = d; best = t; } }
    if (best) {
      const dx = best.x - sn.x; sn.dir = dx > 0 ? 1 : -1; sn.moving = Math.abs(dx) > 1;
      sn.x += sn.dir * Math.min(Math.abs(dx), snailSpeed(state.snailLv) * dt);
      if (Math.abs(best.x - sn.x) < 6) collectTreasure(best);
    } else sn.moving = false;
  }
  // 打氣機：從右邊石頭冒出一串氣泡
  if (state.pumpLv > 0 && Math.random() < dt * (5 + state.pumpLv * 4)) bubbles.push({ x: W * .535 + rand(-3, 3), y: H - 16, r: rand(2, 4.5), vy: rand(60, 100) });
  // 金幣飛向左上角的金幣數
  for (let i = coinFx.length - 1; i >= 0; i--) {
    const f = coinFx[i]; f.t += dt; f.spin += dt * 9;
    if (f.t >= f.dur) { coinFx.splice(i, 1); const pill = $('#coinPill'); pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump'); }
  }
  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) particles.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.y -= 30 * dt; t.life -= dt; if (t.life <= 0) texts.splice(i, 1); }
  if (Math.random() < dt * 3) bubbles.push({ x: rand(20, W - 20), y: FLOOR, r: rand(1.5, 4), vy: rand(30, 70) });
  for (let i = bubbles.length - 1; i >= 0; i--) { const b = bubbles[i]; b.y -= b.vy * dt; b.x += Math.sin(T * 3 + b.r * 10) * 10 * dt; if (b.y < 5) bubbles.splice(i, 1); }
}

function drawDynamicBg() {

    for (let i = 0; i < 9; i++) {

      for (let x = 0; x <= W; x += 25) { const y = FLOOR + 10 + i * 7 + Math.sin(x * .025 + T * 1.1 + i * 1.7) * 5 + Math.sin(x * .061 - T * .8 + i) * 3; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }

    }

  const [pc0, pc1] = th.plant.map(hex);
  // 後排有擺出來的造景時，前面的海草先移開，才看得清楚
  const back = SCENE.filter(p => !p.layer && state.scene[p.id].look).map(p => [scenePos(p).x, p.box[state.scene[p.id].look - 1][0] * sceneK(p) * .8]);
  for (const p of PLANTS) {

    const n = 6, L = [], R = [];
    for (let k = 0; k <= n; k++) {
      const q = k / n, sway = Math.sin(T * 1.1 + p.ph + q * 1.8) * q * 26 + p.bend * q * q, x = p.x + sway, y = FLOOR + 6 - p.h * q, hw = p.w * Math.sin(Math.PI * (.18 + q * .72)) * (1 - q * .35);
      L.push([x - hw, y]); R.push([x + hw, y]);

    for (let k = 0; k < n; k++) {

    }
  }
  if (bg.id === 'sakura') {
    for (let i = 0; i < 28; i++) {
      const x = ((i * 211.7 + T * (12 + i % 5 * 4) + Math.sin(T * .8 + i) * 30) % (W + 40) + W + 40) % (W + 40) - 20, y = (i * 97.1 + T * (14 + i % 4 * 5)) % (FLOOR + 20) - 10;
      ctx.save(); ctx.translate(x, y); ctx.rotate(T * (1 + i % 3) + i);
      ctx.fillStyle = i % 3 ? 'rgba(255,190,215,0.9)' : 'rgba(255,225,238,0.9)'; ell(ctx, 0, 0, 5, 3); ctx.fill(); ctx.restore();

      ctx.fillStyle = `rgba(255,${120 + (i % 4) * 30},40,${.5 + .4 * Math.sin(T * 3 + i)})`; circle(ctx, x, y, 1.5 + (i % 3)); ctx.fill();
    }
  }
  // 海中微粒（海雪），深色背景會發光
  for (let i = 0; i < 46; i++) {
    const x = ((i * 157.3 + T * (4 + i % 5) * (i % 2 ? 1 : -1)) % W + W) % W, y = (i * 83.7 + T * (6 + i % 4)) % (FLOOR - 20) + 10;
    const a = th.snowGlow ? .35 + .35 * Math.sin(T * 2 + i) : .28 + .12 * Math.sin(T + i);
    ctx.fillStyle = th.snowGlow ? `rgba(150,255,235,${a})` : `rgba(255,255,255,${a})`;

    const x = (T * 97) % W; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, 40); ctx.lineTo(x - 60, 80); ctx.stroke();
  }
  if (bg.id === 'jelly') {

      const x = (i * 230 + T * 8) % (W + 100) - 50, y = 120 + i * 60 % 250 + Math.sin(T * .8 + i) * 25, pulse = 1 + Math.sin(T * 2 + i) * .1;

    }
  }
}

function render() {

// ====== 匯出／匯入存檔 ======
// 存檔碼格式：AQ2:<長度>:<base64>。記下長度，才能判斷是不是只複製到一部分
// 匯出時會把沙地上還沒撿的寶物直接換成金幣、拿掉游動方向等暫時資料、數字四捨五入，讓存檔碼短一點比較好複製
function saveCode() {
  save();
  const d = JSON.parse(JSON.stringify(state));
  d.coins += d.treasures.reduce((a, t) => a + Math.round(TREASURE[t.type].value * (t.mult || 1) * B.value), 0);
  d.treasures = [];
  d.fish = d.fish.map(f => ({ id: f.id, sp: f.sp, name: f.name, x: f.x, y: f.y, hunger: f.hunger, growth: f.growth, foodMult: f.foodMult, dropT: f.dropT }));
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(d, (k, v) => typeof v === 'number' && !Number.isInteger(v) ? Math.round(v * 100) / 100 : v))));
  return `AQ2:${b64.length}:${b64}`;
}
// 盡量容錯：忽略空白與看不見的字元、全形冒號、前後多餘的文字
function parseCode(code) {
  const t = String(code || '').replace(/[\s ​-‍﻿]+/g, '').replace(/：/g, ':');
  if (!t) return { err: '還沒有貼上存檔碼。請長按輸入框，選「貼上」。' };
  const m = t.match(/AQ([12]):(?:(\d+):)?([A-Za-z0-9+/=_-]*)/);
  if (!m) return { err: '找不到存檔碼。請確認貼上的是「AQ」開頭的那一整串文字。' };
  let b = m[3].replace(/-/g, '+').replace(/_/g, '/').replace(/=+$/, '');
  const want = m[2] ? +m[2] : 0;
  if (want && m[3].length < want) return { err: `存檔碼不完整，只複製到大約 ${Math.max(1, Math.floor(m[3].length / want * 100))}%。\n請回到原本的遊戲，按「📋 複製」重新複製一次。` };
  while (b.length % 4) b += '=';
  try {
    const d = JSON.parse(decodeURIComponent(escape(atob(b))));
    if (d && typeof d.coins === 'number' && Array.isArray(d.fish)) return { data: d };
  } catch (e) { }
  return { err: '存檔碼看起來有缺字或多了字，沒辦法讀取。\n請回到原本的遊戲，按「📋 複製」重新複製一次。' };
}

let last = performance.now(), hudT = 0, saveT = 0, cloudT = 0, lastCoins = -1, lastFishN = -1, lastStars = -1;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  update(dt); render();
  hudT += dt; saveT += dt;
  if (state.coins !== lastCoins || state.fish.length !== lastFishN || state.stars !== lastStars) {
    if (state.fish.length !== lastFishN && menuOpen && tab === 'shop' && !panelPressed) setTimeout(renderTab, 0);
    lastCoins = state.coins; lastFishN = state.fish.length; lastStars = state.stars;
    $('#starPill').textContent = `⭐ ${fmt(state.stars)}`;
    $('#coinPill').textContent = `💰 ${fmt(state.coins)}`; $('#fishPill').textContent = `🐟 ${state.fish.length}/${capacity()}`;
  }
  if (hudT > .5) {
    hudT = 0; refreshAfford(); if (selFishId) updateFishCard();
    if (menuOpen && tab === 'mine' && !panelPressed && (T | 0) % 2 === 0) renderTab();
  }
  if (saveT > 5) { saveT = 0; save(); }
  cloudT += dt; if (cloudT > 120) { cloudT = 0; Cloud.upload(); }
  requestAnimationFrame(frame);
}

// ====== 離線收益 ======
// 離開期間魚兒照樣產寶，但只算正常速度的 30%，最多累積 2 小時（升級離線收集網可到 8 小時）；離開時不會肚子餓
const OFFLINE_RATE = 0.3;
function incomePerSec() {
  let v = 0;
  for (const f of state.fish) if (f.growth >= 1) { const sp = SP[f.sp]; v += avgTreasure(sp.pool) * sp.mult / sp.dropEvery; }
  for (const id of state.starShown) { const sp = SSP[id]; v += avgTreasure(sp.pool) * sp.mult / sp.dropEvery; }
  return v * B.value * B.drop;
}
function fmtDur(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  return h ? `${h} 小時${m ? ` ${m} 分鐘` : ''}` : `${Math.max(1, m)} 分鐘`;
}
let offlineShown = false;
function checkOffline() {
  const now = Date.now(), away = state.lastSeen ? (now - state.lastSeen) / 1000 : 0;
  state.lastSeen = now;
  if (away < 60 || offlineShown) return;
  const sec = Math.min(away, offlineMaxH() * 3600), amt = Math.floor(incomePerSec() * sec * OFFLINE_RATE * B.offline);
  if (amt < 1) return;
  offlineShown = true;
  $('#welcomeMsg').textContent = `歡迎回來！\n你離開了 ${fmtDur(away)}，魚兒們找到的寶物已經換成金幣${away > sec ? `\n（最多只能累積 ${offlineMaxH()} 小時，可以升級「離線收集網」）` : ''}：`;
  $('#welcomeAmt').textContent = `💰 ${fmt(amt)}`;
  $('#welcome').hidden = false;
  $('#welcomeOk').onclick = () => {
    $('#welcome').hidden = true; offlineShown = false;
    state.coins += amt; state.earned += amt; toast(`收下了 💰${fmt(amt)}`); save(); Music.start();
  };
}

// ====== 背景音樂（即時合成：柔和和弦 + 音樂盒旋律 + 海水聲 + 水滴與遠方鯨鳴） ======
const Music = (() => {
  const KEY = 'aquarium-music', BAR = 8;
  const CHORDS = [[48, 55, 64, 71], [45, 52, 60, 67], [41, 48, 57, 64], [43, 50, 59, 62]];
  const SCALE = [72, 74, 76, 79, 81, 84, 86, 88];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  let ac, master, wet, timer, nextBar = 0, nextNote = 0, nextDrop = 0, nextWhale = 0, bar = 0, playing = false, unlockEl;
  let wanted = true;
  try { wanted = localStorage.getItem(KEY) !== 'off'; } catch (e) { }
  // iPhone 靜音鍵會讓網頁音效沒聲音；先播放一段無聲的 <audio>，把音訊模式切成「播放」
  function silentWav() {
    const n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer), w = (o, str) => [...str].forEach((ch, i) => b[o + i] = ch.charCodeAt(0));

    v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true); b.fill(128, 44);
    let bin = ''; b.forEach(x => bin += String.fromCharCode(x)); return 'data:audio/wav;base64,' + btoa(bin);

    const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
    master = ac.createGain(); master.gain.value = 0; master.connect(comp);
    const verb = ac.createConvolver(), len = ac.sampleRate * 3.5, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    verb.buffer = ir; wet = ac.createGain(); wet.gain.value = .9; wet.connect(verb); verb.connect(master);
    // 海水聲：低通濾過的布朗噪音，濾波頻率緩慢起伏
    const nb = ac.createBuffer(1, ac.sampleRate * 4, ac.sampleRate), nd = nb.getChannelData(0); let last = 0;
    for (let i = 0; i < nd.length; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; nd[i] = last * 3.2; }
    const src = ac.createBufferSource(); src.buffer = nb; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
    const lfo = ac.createOscillator(), lfoG = ac.createGain(); lfo.frequency.value = .08; lfoG.gain.value = 200; lfo.connect(lfoG); lfoG.connect(lp.frequency);
    const ng = ac.createGain(); ng.gain.value = .22; src.connect(lp); lp.connect(ng); ng.connect(master); src.start(); lfo.start();
    return true;
  }
  function pad(chord, t) {

      const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = hz(m); o.detune.value = det; f.type = 'lowpass'; f.frequency.value = 900;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.018, t + 2.5); g.gain.setValueAtTime(.018, t + BAR - .5); g.gain.linearRampToValueAtTime(0, t + BAR + 2.5);

  function whale(t) {
    const o = ac.createOscillator(), vib = ac.createOscillator(), vg = ac.createGain(), lp = ac.createBiquadFilter(), g = ac.createGain(), f0 = rand(150, 210);
    o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f0 * 1.7, t + 2.2); o.frequency.linearRampToValueAtTime(f0 * 1.2, t + 4.5);

  function toggle() { wanted = !wanted; try { localStorage.setItem(KEY, wanted ? 'on' : 'off'); } catch (e) { } wanted ? start() : stop(); toast(wanted ? '🎵 背景音樂開啟' : '🔇 背景音樂關閉'); }

})();

if (migrateNote) { ask(migrateNote, '好', null); migrateNote = ''; }
// 之前登入過 Google 的話，打開遊戲就自動恢復登入並開始雲端備份
if (Cloud.enabled()) Cloud.init().catch(() => { });
// 一打開就申請存檔保護；有些瀏覽器要點過畫面才會同意，所以第一次點畫面時再申請一次
requestPersist();
document.addEventListener('pointerdown', () => { if (persistState !== 'granted') requestPersist(); }, { once: true });
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); Cloud.upload(); } else checkOffline(); });
requestAnimationFrame(frame);
</script>
